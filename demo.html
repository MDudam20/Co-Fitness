<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Diet Plan Form</title>

   <style>
    .diet-btn{
padding:14px 30px;
background:#ff6a00;
color:#fff;
border:none;
border-radius:30px;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:.3s;
}

.diet-btn:hover{
background:#ff7f1f;
transform:scale(1.05);
}

.diet-modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.6);
display:none;
justify-content:center;
align-items:center;
z-index:999;
}

.diet-box{
background:#fff;
width:90%;
max-width:700px;
padding:35px;
border-radius:15px;
box-shadow:0 20px 60px rgba(0,0,0,.2);
position:relative;
}

.diet-box h2{
text-align:center;
color:#ff6a00;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:20px;
}

.grid input,
.grid select,
.grid textarea{
padding:12px;
border-radius:8px;
border:1px solid #ddd;
font-size:14px;
}

.grid textarea{
grid-column:1/3;
}

.submit-btn{
margin-top:20px;
width:100%;
padding:14px;
background:#ff6a00;
color:#fff;
border:none;
border-radius:8px;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:.3s;
}

.submit-btn:hover{
background:#ff7f1f;
}

.close-btn{
position:absolute;
top:15px;
right:20px;
font-size:22px;
cursor:pointer;
color:#ff6a00;
}

.terms{
display:flex;
gap:10px;
margin-top:15px;
font-size:14px;
}

.error{
color:red;
display:none;
font-size:14px;
}

.wa-popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.7);
display:none;
justify-content:center;
align-items:center;
}

.wa-box{
background:#fff;
padding:35px;
text-align:center;
border-radius:12px;
max-width:360px;
}

.wa-box h3{
color:#ff6a00;
}

.wa-btn{
display:inline-block;
margin-top:15px;
padding:12px 20px;
background:#25D366;
color:#fff;
border-radius:8px;
text-decoration:none;
font-weight:600;
}
   </style>
</head>

<body>

    <button class="diet-btn" onclick="openForm()">Get Your AI Diet Plan</button>

    <div class="diet-modal" id="dietModal">
    
        <div class="diet-box">
    
            <span class="close-btn" onclick="closeForm()">×</span>
    
            <h2>Get Your AI Diet Plan</h2>
    
            <form id="dietForm">
    
                <div class="grid">
    
                    <input type="number" placeholder="Age" required>
    
                    <select required>
                        <option value="">Gender</option>
                        <option>Male</option>
                        <option>Female</option>
                    </select>
    
                    <input type="number" placeholder="Height (cm)" required>
    
                    <input type="number" placeholder="Weight (kg)" required>
    
                    <select required>
                        <option value="">Fitness Goal</option>
                        <option>Weight Loss</option>
                        <option>Muscle Gain</option>
                        <option>Fat Loss</option>
                        <option>General Fitness</option>
                    </select>
    
                    <select required>
                        <option value="">Diet Preference</option>
                        <option>Vegetarian</option>
                        <option>Non Vegetarian</option>
                        <option>Vegan</option>
                    </select>
    
                    <select required>
                        <option value="">Activity Level</option>
                        <option>Sedentary</option>
                        <option>Lightly Active</option>
                        <option>Moderately Active</option>
                        <option>Very Active</option>
                    </select>
    
                    <textarea placeholder="Medical Conditions (optional)"></textarea>
    
                </div>
    
                <div class="terms">
    
                    <input type="checkbox" id="terms">
    
                    <label>
                        I agree that the AI generated diet plan is informational only and not medical advice.
                    </label>
    
                </div>
    
                <p class="error" id="errorMsg">Please accept Terms & Conditions</p>
    
                <button class="submit-btn">Generate My Diet Plan</button>
    
            </form>
    
        </div>
    
    </div>


    <div class="wa-popup" id="waPopup">
    
        <div class="wa-box">
    
            <h3>One More Step</h3>
    
            <p>To receive your AI diet plan, please join our WhatsApp community first.</p>
    
            <a href="https://chat.whatsapp.com/YOUR-LINK" target="_blank" class="wa-btn">
                Join WhatsApp Community
            </a>
    
        </div>
    
    </div>


    <script>
        function openForm() {
            document.getElementById("dietModal").style.display = "flex";
        }

        function closeForm() {
            document.getElementById("dietModal").style.display = "none";
        }

        document.getElementById("dietForm").addEventListener("submit", function (e) {

            e.preventDefault();

            let terms = document.getElementById("terms");

            if (!terms.checked) {
                document.getElementById("errorMsg").style.display = "block";
                return;
            }

            document.getElementById("dietModal").style.display = "none";
            document.getElementById("waPopup").style.display = "flex";

        });
    </script>

</body>

</html>
