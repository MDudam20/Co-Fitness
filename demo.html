<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Social + Video Section</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Slick Slider -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css"/>

  <style>
    body {
      background: #0f0f0f;
    }

    .social-video-section {
      padding: 60px 0;
    }

    .custom-card {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.08);
      height: 100%;
      transition: 0.4s;
    }

    .custom-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
    }

    .section-title {
      color: #fff;
      margin-bottom: 15px;
    }

    /* Facebook */
    .fb-post-wrapper iframe {
      border-radius: 12px;
      width: 100%;
      height: 420px;
    }

    /* Video Slider */
    .video-card {
      padding: 10px;
    }

    .video-card video {
      width: 100%;
      height: 230px;
      object-fit: cover;
      border-radius: 12px;
    }

    /* Controls */
    .slider-controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 15px;
    }

    .slider-controls button {
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 50%;
      background: orange;
      color: #000;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
    }

    .slider-controls button:hover {
      background: #fff;
      transform: scale(1.1);
    }
  </style>
</head>

<body>

<section class="social-video-section">
  <div class="container">
    <div class="row g-4">

      <!-- LEFT: FACEBOOK -->
      <div class="col-lg-6">
        <div class="custom-card">
          <h4 class="section-title">Latest Facebook Post</h4>

          <div class="fb-post-wrapper">
            <iframe 
              src="https://www.facebook.com/plugins/post.php?href=https://www.facebook.com/facebook/posts/10153231379946729&show_text=true"
              scrolling="no"
              frameborder="0"
              allowfullscreen="true">
            </iframe>
          </div>

        </div>
      </div>

      <!-- RIGHT: VIDEO SLIDER -->
      <div class="col-lg-6">
        <div class="custom-card">
          <h4 class="section-title">Client Transformations</h4>

          <div class="video-slider">

            <div class="video-card">
              <video controls>
                <source src="videos/video1.mp4" type="video/mp4">
              </video>
            </div>

            <div class="video-card">
              <video controls>
                <source src="videos/video2.mp4" type="video/mp4">
              </video>
            </div>

            <div class="video-card">
              <video controls>
                <source src="videos/video3.mp4" type="video/mp4">
              </video>
            </div>

            <div class="video-card">
              <video controls>
                <source src="videos/video4.mp4" type="video/mp4">
              </video>
            </div>

          </div>

          <!-- CONTROLS -->
          <div class="slider-controls">
            <button class="prev-btn">←</button>
            <button class="next-btn">→</button>
          </div>

        </div>
      </div>

    </div>
  </div>
</section>

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>

<script>
  $('.video-slider').slick({
    slidesToShow: 2,
    slidesToScroll: 2,
    infinite: true,
    arrows: false,
    dots: false,
    responsive: [
      {
        breakpoint: 768,
        settings: {
          slidesToShow: 1,
          slidesToScroll: 1
        }
      }
    ]
  });

  $('.next-btn').click(function(){
    $('.video-slider').slick('slickNext');
  });

  $('.prev-btn').click(function(){
    $('.video-slider').slick('slickPrev');
  });

  // Pause videos on slide change
  $('.video-slider').on('beforeChange', function(){
    $('video').each(function(){
      this.pause();
    });
  });
</script>

</body>
</html>
